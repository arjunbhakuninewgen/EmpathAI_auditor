services:
  # --- 1. BACKEND SERVICE (FastAPI) ---
  - type: web
    name: empathai-backend
    runtime: python
    region: oregon
    plan: free
    # Install Python libraries AND the Browser for Playwright
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_API_KEY
        sync: false  # This forces Render to ask you for the key securely

  # --- 2. FRONTEND SERVICE (Streamlit) ---
  - type: web
    name: empathai-frontend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    # Start Streamlit on the specific port Render assigns
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_URL
        # Internal Networking: The frontend talks to the backend directly via Render's private network
        # This is faster and more secure than using the public https URL
        value: https://empathai-backend.onrender.com/scan