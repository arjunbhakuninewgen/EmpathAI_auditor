services:
  # --- 1. BACKEND SERVICE (FastAPI) ---
  - type: web
    name: empathai-backend
    runtime: python
    plan: free
    # Install Python libraries AND the Browser for Playwright
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    # Start the Uvicorn server
    startCommand: python backend/main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_API_KEY
        sync: false  # This forces Render to ask you for the key securely

  # --- 2. FRONTEND SERVICE (Streamlit) ---
  services:
  # --- 1. BACKEND SERVICE (FastAPI) ---
  - type: web
    name: empathai-backend
    runtime: python
    plan: free
    # Install Python libraries AND the Browser for Playwright
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    # Start the Uvicorn server
    startCommand: python backend/main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_API_KEY
        sync: false  # This forces Render to ask you for the key securely


 # --- 2. FRONTEND SERVICE (Streamlit) ---
  - type: web
    name: empathai-frontend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: API_URL
        value: https://empathai-backend.onrender.com/scan
